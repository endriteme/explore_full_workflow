name: Send HTTP access logs

on:
  workflow_dispatch:
    inputs:
      intake_secret_name:
        description: GitHub secret name containing the intake key
        required: true
        type: string

permissions:
  contents: read

jobs:
  send-http-access-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Send HTTP access logs
        env:
          INTAKE_KEY: ${{ secrets[inputs.intake_secret_name] }}
        run: |
          if [[ -z "$INTAKE_KEY" ]]; then
            echo "The requested intake secret was not found or is empty." >&2
            exit 1
          fi
          bash scripts/send_http_access_logs_v2.sh
