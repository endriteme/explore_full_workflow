name: Inspect Sekoia intake

on:
  workflow_dispatch:
    inputs:
      intake_uuid:
        description: UUID of the Sekoia intake to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect intake
        env:
          SEKOIA_API_KEY: ${{ secrets.SEKOIA_INTAKE_API_KEY }}
          INTAKE_UUID: ${{ inputs.intake_uuid }}
        run: |
          set -euo pipefail

          if [[ -z "$SEKOIA_API_KEY" ]]; then
            echo "Missing repository secret: SEKOIA_INTAKE_API_KEY" >&2
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            "https://app.sekoia.io/api/v1/sic/conf/intakes/${INTAKE_UUID}" \
            -H "Authorization: Bearer ${SEKOIA_API_KEY}" \
            -H "Accept: application/json")"

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Sekoia API returned HTTP ${HTTP_STATUS}" >&2
            cat "$RESPONSE_FILE" >&2
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          echo "Intake metadata:"
          jq '{
            uuid,
            name,
            community_uuid,
            entity_uuid,
            format_uuid,
            configured,
            status,
            connector_configuration_uuid
          }' "$RESPONSE_FILE"

          if jq -e '.intake_key != null and .intake_key != ""' "$RESPONSE_FILE" >/dev/null; then
            if command -v sha256sum >/dev/null 2>&1; then
              FINGERPRINT="$(jq -r '.intake_key' "$RESPONSE_FILE" | sha256sum | cut -c1-16)"
            else
              FINGERPRINT="$(jq -r '.intake_key' "$RESPONSE_FILE" | shasum -a 256 | cut -c1-16)"
            fi
            echo "API-returned intake key fingerprint: ${FINGERPRINT}"
          else
            echo "The API response did not contain an intake_key field."
          fi

          rm -f "$RESPONSE_FILE"
